<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래처 등록 - 비즈니스 관리 시스템</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2bae66;
            --primary-dark: #094d28;
            --primary-light: #4ade80;
            --secondary-color: #22c55e;
            --accent-color: #16a34a;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 상단 헤더 */
        .header {
            background: var(--card-background);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: var(--shadow-md);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-item:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .nav-item.active {
            background: var(--primary-color);
            color: white;
        }

        /* 메인 컨텐츠 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* 페이지 타이틀 */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .page-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* 등록 폼 */
        .form-container {
            background: var(--card-background);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 24px 32px;
            text-align: center;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-description {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-body {
            padding: 40px 32px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .required {
            color: #ef4444;
            font-weight: 700;
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(43, 174, 102, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
        }

        /* 버튼 */
        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--background-color);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        /* 메시지 */
        .messages {
            max-width: 900px;
            margin: 0 auto 24px;
        }

        .message {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .message.warning {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .header-container {
                padding: 0 16px;
            }

            .nav-menu {
                display: none;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-body {
                padding: 24px 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 헤더 -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-building"></i>
                </div>
                <span>비즈니스 관리 시스템</span>
            </a>

            <nav class="nav-menu">
                <a href="/" class="nav-item">대시보드</a>
                <a href="/client_inform/" class="nav-item active">거래처</a>
                <a href="/businessStatus/" class="nav-item">업무현황</a>
                <a href="/공지사항/" class="nav-item">공지사항</a>
                <a href="/기술/" class="nav-item">기술</a>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="main-container">
        <!-- 메시지 표시 -->
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- 페이지 헤더 -->
        <div class="page-header">
            <h1 class="page-title">거래처 등록</h1>
            <p class="page-subtitle">새로운 거래처 정보를 등록합니다</p>
        </div>

        <!-- 등록 폼 -->
        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title">거래처 정보 입력</h2>
                <p class="form-description">필수 정보(*)는 반드시 입력해주세요</p>
            </div>

            <form method="post" class="form-body">
                {% csrf_token %}
                
                <!-- 기본 정보 -->
                <div class="form-section">
                    <h3 class="section-title">기본 정보</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">
                                회사명 <span class="required">*</span>
                            </label>
                            <input type="text" name="company_name" class="form-input" required 
                                   placeholder="예: ABC 기술" value="{{ request.POST.company_name|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                대표자명 <span class="required">*</span>
                            </label>
                            <input type="text" name="representative" class="form-input" required 
                                   placeholder="예: 김철수" value="{{ request.POST.representative|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                연락처 <span class="required">*</span>
                            </label>
                            <input type="tel" name="phone_number" class="form-input" required 
                                   placeholder="예: 02-1234-5678" value="{{ request.POST.phone_number|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">사업자등록번호</label>
                            <input type="text" name="business_registration_number" class="form-input" 
                                   placeholder="예: 123-45-67890" value="{{ request.POST.business_registration_number|default:'' }}">
                        </div>
                    </div>
                </div>

                <!-- 지역 정보 -->
                <div class="form-section">
                    <h3 class="section-title">지역 정보</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">지역</label>
                            <select name="region" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="서울" {% if request.POST.region == '서울' %}selected{% endif %}>서울</option>
                                <option value="경기" {% if request.POST.region == '경기' %}selected{% endif %}>경기</option>
                                <option value="인천" {% if request.POST.region == '인천' %}selected{% endif %}>인천</option>
                                <option value="대전" {% if request.POST.region == '대전' %}selected{% endif %}>대전</option>
                                <option value="대구" {% if request.POST.region == '대구' %}selected{% endif %}>대구</option>
                                <option value="부산" {% if request.POST.region == '부산' %}selected{% endif %}>부산</option>
                                <option value="광주" {% if request.POST.region == '광주' %}selected{% endif %}>광주</option>
                                <option value="울산" {% if request.POST.region == '울산' %}selected{% endif %}>울산</option>
                                <option value="세종" {% if request.POST.region == '세종' %}selected{% endif %}>세종</option>
                                <option value="강원" {% if request.POST.region == '강원' %}selected{% endif %}>강원</option>
                                <option value="충북" {% if request.POST.region == '충북' %}selected{% endif %}>충북</option>
                                <option value="충남" {% if request.POST.region == '충남' %}selected{% endif %}>충남</option>
                                <option value="전북" {% if request.POST.region == '전북' %}selected{% endif %}>전북</option>
                                <option value="전남" {% if request.POST.region == '전남' %}selected{% endif %}>전남</option>
                                <option value="경북" {% if request.POST.region == '경북' %}selected{% endif %}>경북</option>
                                <option value="경남" {% if request.POST.region == '경남' %}selected{% endif %}>경남</option>
                                <option value="제주" {% if request.POST.region == '제주' %}selected{% endif %}>제주</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">사업장 주소</label>
                            <input type="text" name="business_address" class="form-input" 
                                   placeholder="예: 서울시 강남구 테헤란로 123" value="{{ request.POST.business_address|default:'' }}">
                        </div>
                    </div>
                </div>

                <!-- 사업 정보 -->
                <div class="form-section">
                    <h3 class="section-title">사업 정보</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">사업 분야</label>
                            <select name="division" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="IT/소프트웨어" {% if request.POST.division == 'IT/소프트웨어' %}selected{% endif %}>IT/소프트웨어</option>
                                <option value="하드웨어" {% if request.POST.division == '하드웨어' %}selected{% endif %}>하드웨어</option>
                                <option value="통신" {% if request.POST.division == '통신' %}selected{% endif %}>통신</option>
                                <option value="금융" {% if request.POST.division == '금융' %}selected{% endif %}>금융</option>
                                <option value="제조" {% if request.POST.division == '제조' %}selected{% endif %}>제조</option>
                                <option value="유통" {% if request.POST.division == '유통' %}selected{% endif %}>유통</option>
                                <option value="서비스" {% if request.POST.division == '서비스' %}selected{% endif %}>서비스</option>
                                <option value="기타" {% if request.POST.division == '기타' %}selected{% endif %}>기타</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">주요 사업 분야</label>
                            <input type="text" name="sectors" class="form-input" 
                                   placeholder="예: SI, SM, 솔루션 개발" value="{{ request.POST.sectors|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">주력 사업</label>
                            <input type="text" name="main_business" class="form-input" 
                                   placeholder="예: 금융권 SI 프로젝트" value="{{ request.POST.main_business|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">직원 수</label>
                            <input type="number" name="number_of_employees" class="form-input" 
                                   placeholder="예: 50" value="{{ request.POST.number_of_employees|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">연매출</label>
                            <input type="text" name="annual_sales" class="form-input" 
                                   placeholder="예: 100억" value="{{ request.POST.annual_sales|default:'' }}">
                        </div>
                    </div>
                </div>

                <!-- 계약 정보 -->
                <div class="form-section">
                    <h3 class="section-title">계약 정보</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">계약 상태</label>
                            <select name="contract_status" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="정상" {% if request.POST.contract_status == '정상' %}selected{% endif %}>정상</option>
                                <option value="만료" {% if request.POST.contract_status == '만료' %}selected{% endif %}>만료</option>
                                <option value="종료" {% if request.POST.contract_status == '종료' %}selected{% endif %}>종료</option>
                                <option value="협의중" {% if request.POST.contract_status == '협의중' %}selected{% endif %}>협의중</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">V3 계약 상태</label>
                            <select name="v3_contract_status" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="계약" {% if request.POST.v3_contract_status == '계약' %}selected{% endif %}>계약</option>
                                <option value="만료" {% if request.POST.v3_contract_status == '만료' %}selected{% endif %}>만료</option>
                                <option value="미계약" {% if request.POST.v3_contract_status == '미계약' %}selected{% endif %}>미계약</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">담당자</label>
                            <input type="text" name="staff_in_charge" class="form-input" 
                                   placeholder="예: 김영업" value="{{ request.POST.staff_in_charge|default:'' }}">
                        </div>
                    </div>
                </div>

                <!-- 시스템 정보 -->
                <div class="form-section">
                    <h3 class="section-title">시스템 정보</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">이메일</label>
                            <input type="email" name="e_mail" class="form-input" 
                                   placeholder="예: contact@company.com" value="{{ request.POST.e_mail|default:'' }}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">ERP 유지보수</label>
                            <select name="erp_maintenance" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="유지" {% if request.POST.erp_maintenance == '유지' %}selected{% endif %}>유지</option>
                                <option value="종료" {% if request.POST.erp_maintenance == '종료' %}selected{% endif %}>종료</option>
                                <option value="미사용" {% if request.POST.erp_maintenance == '미사용' %}selected{% endif %}>미사용</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">ERP 사용 상태</label>
                            <select name="erp_usage_status" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="정상" {% if request.POST.erp_usage_status == '정상' %}selected{% endif %}>정상</option>
                                <option value="중단" {% if request.POST.erp_usage_status == '중단' %}selected{% endif %}>중단</option>
                                <option value="일부" {% if request.POST.erp_usage_status == '일부' %}selected{% endif %}>일부</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">그룹웨어</label>
                            <select name="groupware" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="사용" {% if request.POST.groupware == '사용' %}selected{% endif %}>사용</option>
                                <option value="미사용" {% if request.POST.groupware == '미사용' %}selected{% endif %}>미사용</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 평가 및 비고 -->
                <div class="form-section">
                    <h3 class="section-title">평가 및 비고</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">회사 평가</label>
                            <select name="company_evaluation" class="form-select">
                                <option value="">선택하세요</option>
                                <option value="A" {% if request.POST.company_evaluation == 'A' %}selected{% endif %}>A (최우수)</option>
                                <option value="B" {% if request.POST.company_evaluation == 'B' %}selected{% endif %}>B (우수)</option>
                                <option value="C" {% if request.POST.company_evaluation == 'C' %}selected{% endif %}>C (보통)</option>
                                <option value="D" {% if request.POST.company_evaluation == 'D' %}selected{% endif %}>D (미흡)</option>
                            </select>
                        </div>
                        
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label class="form-label">특이사항 및 비고</label>
                            <textarea name="note" class="form-textarea" 
                                      placeholder="특이사항이나 참고할 내용을 입력하세요">{{ request.POST.note|default:'' }}</textarea>
                        </div>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        거래처 등록
                    </button>
                    <a href="/client_inform/" class="btn btn-secondary">
                        <i class="fas fa-times"></i>
                        취소
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        // 폼 유효성 검사
        document.querySelector('form').addEventListener('submit', function(e) {
            const companyName = document.querySelector('input[name="company_name"]').value.trim();
            const representative = document.querySelector('input[name="representative"]').value.trim();
            const phoneNumber = document.querySelector('input[name="phone_number"]').value.trim();
            
            if (!companyName) {
                e.preventDefault();
                alert('회사명은 필수 항목입니다.');
                document.querySelector('input[name="company_name"]').focus();
                return false;
            }
            
            if (!representative) {
                e.preventDefault();
                alert('대표자명은 필수 항목입니다.');
                document.querySelector('input[name="representative"]').focus();
                return false;
            }
            
            if (!phoneNumber) {
                e.preventDefault();
                alert('연락처는 필수 항목입니다.');
                document.querySelector('input[name="phone_number"]').focus();
                return false;
            }
            
            return true;
        });

        // 전화번호 형식 자동 변환
        document.querySelector('input[name="phone_number"]').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9-]/g, '');
            e.target.value = value;
        });

        // 사업자등록번호 형식 자동 변환
        document.querySelector('input[name="business_registration_number"]').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (value.length >= 3) {
                value = value.slice(0, 3) + '-' + value.slice(3);
            }
            if (value.length >= 6) {
                value = value.slice(0, 6) + '-' + value.slice(6);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
