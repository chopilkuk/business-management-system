<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 추가 - 비즈니스 관리 시스템</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2bae66;
            --primary-dark: #094d28;
            --primary-light: #4ade80;
            --secondary-color: #22c55e;
            --accent-color: #16a34a;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .header {
            background: var(--card-background);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: var(--shadow-md);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .nav-item.active {
            background: var(--primary-color);
            color: white;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .page-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .form-container {
            background: var(--card-background);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 24px 32px;
            text-align: center;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-body {
            padding: 40px 32px;
        }

        .form-grid {
            display: grid;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .required {
            color: #ef4444;
            font-weight: 700;
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(43, 174, 102, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--background-color);
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .messages {
            max-width: 800px;
            margin: 0 auto 24px;
        }

        .message {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 768px) {
            .header-container {
                padding: 0 16px;
            }

            .nav-menu {
                display: none;
            }

            .form-body {
                padding: 24px 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-building"></i>
                </div>
                <span>비즈니스 관리 시스템</span>
            </a>

            <nav class="nav-menu">
                <a href="/" class="nav-item">대시보드</a>
                <a href="/calendar/" class="nav-item active">캘린더</a>
                <a href="/client_inform/" class="nav-item">거래처</a>
                <a href="/businessStatus/" class="nav-item">업무현황</a>
                <a href="/공지사항/" class="nav-item">공지사항</a>
                <a href="/기술/" class="nav-item">기술</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="page-header">
            <h1 class="page-title">일정 추가</h1>
            <p class="page-subtitle">새로운 일정을 등록합니다</p>
        </div>

        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title">일정 정보 입력</h2>
            </div>

            <form method="post" class="form-body">
                {% csrf_token %}
                
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">
                            제목 <span class="required">*</span>
                        </label>
                        <input type="text" name="title" class="form-input" required 
                               placeholder="예: 회의" value="{{ request.POST.title|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">
                            날짜 <span class="required">*</span>
                        </label>
                        <input type="date" name="date" class="form-input" required 
                               value="{{ request.POST.date|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">시간</label>
                        <input type="time" name="time" class="form-input" 
                               value="{{ request.POST.time|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">장소</label>
                        <input type="text" name="location" class="form-input" 
                               placeholder="예: 회의실 A" value="{{ request.POST.location|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">참석자</label>
                        <input type="text" name="attendees" class="form-input" 
                               placeholder="예: 김철수, 이영희" value="{{ request.POST.attendees|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">중요도</label>
                        <select name="priority" class="form-select">
                            <option value="">선택하세요</option>
                            <option value="높음" {% if request.POST.priority == '높음' %}selected{% endif %}>높음</option>
                            <option value="보통" {% if request.POST.priority == '보통' %}selected{% endif %}>보통</option>
                            <option value="낮음" {% if request.POST.priority == '낮음' %}selected{% endif %}>낮음</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label class="form-label">내용</label>
                        <textarea name="description" class="form-textarea" 
                                  placeholder="일정 상세 내용을 입력하세요">{{ request.POST.description|default:'' }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        일정 등록
                    </button>
                    <a href="/calendar/" class="btn btn-secondary">
                        <i class="fas fa-times"></i>
                        취소
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const title = document.querySelector('input[name="title"]').value.trim();
            const date = document.querySelector('input[name="date"]').value;
            
            if (!title) {
                e.preventDefault();
                alert('제목은 필수 항목입니다.');
                document.querySelector('input[name="title"]').focus();
                return false;
            }
            
            if (!date) {
                e.preventDefault();
                alert('날짜는 필수 항목입니다.');
                document.querySelector('input[name="date"]').focus();
                return false;
            }
            
            return true;
        });
    </script>
</body>
</html>
